    <script>
        let view='home',detail=null,cart=[],qty=1;
        const data={projects:[{id:'p1',title:'Das Blaue meines Bruders',sub:'Pandora Gallery / The Origin',date:'14.02.2026 – 21.02.2026',loc:'Mittenwalder Str. 6, 10961 Berlin',img:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/what_is_on/DAS_BLAUE_MEINES_BRUDERS.jpeg',desc:'In this exhibition, a world emerges that is both interior and beyond what can be seen. Inspired by the anthropological reflections of Philippe Descola, the works examine the relationships between humans, nature, and worldview—a gentle deconstruction of familiar boundaries.\n\nThe objects and images can be read as animistic beings, traces of memory, or echoes of places and moments long past. The "Blue" is more than a color: it is a space where inside and outside, psyche and world, past and present intertwine. Deep beneath the sea, it lies in the memory; high above in the sky, birds remind us of our kin.\n\nThe "Brother" in the title is a declaration of kinship—a call to sense the invisible connections that bind us. The exhibition constructs landscapes from the unseen, and objects from what remains, revealing a world that exists between memory, nature, and a quiet spirituality.\n\nThese works invite the viewer to question perception itself, to explore the porous boundaries between self and environment, and to feel a connection that surpasses what is immediately visible. They are an invitation to dwell in the in-between, to linger in spaces where the tangible meets the ephemeral, and where the world reveals itself as fluid, relational, and alive.\n\nIn "das Blaue meines Bruders," the familiar dissolves and the unseen takes form. It is a meditation on presence and absence, on what is remembered and what endures—a subtle reminder that the world we inhabit is always richer and more interconnected than it appears.\n\nArtists: Keiko Kimoto, Nives Widauer, Morten Stolle, Volker Seifried, Jennifer Oellerich, Johannes Weiß, Nico Kraus'}],artists:[{id:'a1',name:'Volker Seifried',role:'Artist',img:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/Volker_Seifried/Studie_body_93x71x56_2024_01.jpg',bio:'Sculptor and educator based in Berlin.',works:[{t:'Modell für body / study for body',d:'2024-25 / 93 x 71 x 56 cm / Gips und Betonspachtel, Metall / plaster, concrete filler, metal',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/Volker_Seifried/Studie_body_93x71x56_2024_01.jpg'},{t:'Modell für body / study for body',d:'2024-25 / 93 x 71 x 56 cm / Gips und Betonspachtel, Metall / plaster, concrete filler, metal',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/Volker_Seifried/Studie_body_93x71x56_2024_03.jpg'},{t:'Modell für corps / study for corps',d:'2025 / 124 x 120 x 24 cm / Gips und Betonspachtel, Metall / plaster, concrete filler, metal',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/Volker_Seifried/Studie_corps_124x120x24_2025_01.jpg'},{t:'Modell für corps / study for corps',d:'2025 / 124 x 120 x 24 cm / Gips und Betonspachtel, Metall / plaster, concrete filler, metal',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/Volker_Seifried/Studie_corps_124x120x24_2025_03.jpg'},{t:'reset',d:'2009 / 200 x 300 x 200 cm / Holz, Acrylglas, Folie / Wood, acrylic glass, foil\n\nInstallationsansicht: Infernoesque, Berlin, 2009, kuratiert von Johannes Weiss\nInstallation view: Infernoesque, Berlin, 2009, curated by Johannes Weiss',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/Volker_Seifried/reset.glas.glas.jpg'},{t:'reset',d:'2009 / 200 x 300 x 200 cm / Holz, Acrylglas, Folie / Wood, acrylic glass, foil\n\nInstallationsansicht: Infernoesque, Berlin, 2009, kuratiert von Johannes Weiss\nInstallation view: Infernoesque, Berlin, 2009, curated by Johannes Weiss',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/Volker_Seifried/reset.glas.rot.jpg'},{t:'körper',d:'2019-23 / 206 x 62 x 46 cm / Gips und Betonspachtel, Metall / plaster, concrete filler, metal\n\nInstallationsansicht: Kunsthalle Bahnitz, Flüchtigkeit des Augenblicks, 2023, kuratiert von Bodo Rau\nInstallation view: Kunsthalle Bahnitz, The Fleetingness of the Moment, 2023, curated by Bodo Rau',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/Volker_Seifried/koerper_Bahnitz.jpg'},{t:'soma',d:'2016-23 / 210 x 84 x 72 cm / Gips und Betonspachtel, Metall / plaster, concrete filler, metal\n\nInstallationsansicht: Kunsthalle Bahnitz, Flüchtigkeit des Augenblicks, 2023, kuratiert von Bodo Rau\nInstallation view: Kunsthalle Bahnitz, The Fleetingness of the Moment, 2023, curated by Bodo Rau',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/Volker_Seifried/soma_Bahnitz.jpg'}]},{id:'a2',name:'Johannes Weiß',role:'Artist',img:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/JohannesWeiss/DIE_QUELLE_IST_DER_STEIN.jpg',bio:'Johannes Weiß develops a sculptural practice situated between body, architecture, and sign. His works appear less as organic figures than as constructed volumes that order and structure space. Through precise placements, Weiß investigates the body not as representation, but as a formal system—something conceived, built, and mediated.\n\nA language of reduction is characteristic of his sculptures: edges, cuts, and planes recall architectural drawings or technical models. The forms appear calm and self-contained, almost matter-of-fact, while simultaneously carrying a latent tension. Material is not treated expressively but guided with control; surface and volume enter into a sober, nearly distanced relationship with one another.\n\nThe sculptures can be read as three-dimensional blueprints—models of a rationalised corporeality. Fragmentation, abstraction, and seriality detach the figure from any narrative certainty. In place of individual identity, structural principles come to the fore: balance and rupture, load and support, openness and enclosure. The body appears as a façade, as a shell that defines space without fully revealing it.\n\nIn the interplay of multiple works, a quiet, precise constellation unfolds. The sculptures relate to one another and to the surrounding space without establishing hierarchy. They function like signs of an order whose logic is perceptible yet never fully legible. It is within this controlled openness that the central tension of Weiß\'s work resides.\n\nJohannes Weiß approaches sculpture as a form of thinking in space. His works reject narration in favour of a clear, concentrated presence. They invite us to understand corporeality not as expression, but as construction—as a deliberate positioning between idea, material, and space that gradually reveals itself to the viewer, without pathos.',works:[{t:'Die Quelle ist der Stein',d:'2015 / Styropor, Epoxy, Acryl / 200 x 100 x 100 cm',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/JohannesWeiss/DIE_QUELLE_IST_DER_STEIN.jpg'},{t:'Der Echosammler',d:'2015 / Keramik / 34 x 20 x 13 cm',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/JohannesWeiss/ECHOSAMMLER.jpg'},{t:'Der Erzähler',d:'2018 / Keramik / 50 × 35 × 20 cm',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/JohannesWeiss/ERZAEHLER.jpg'},{t:'Die Fontäne',d:'2015 / Styropor, Epoxy, Acryl, Gips / 70 x 40 x 40 cm',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/JohannesWeiss/FONTAENE.jpg'},{t:'Der Patrone',d:'2016 / Styropor, Epoxy, Acryl / 177 x 100 x 100 cm',i:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/JohannesWeiss/PATRONE.jpg'}]}],products:[{id:'s1',title:'Geist',artist:'Johannes Weiß',price:800,img:'https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/SHOP/KLEINER_GEIST.png',desc:'2024 / 10 x 6 x 6 cm'},{id:'s2',title:'scales 2025',artist:'Volker Seifried',price:1400,img:'https://raw.github  Rahmen, je 52 x 42 cm, Museumsglas'}]};
        function render(){const app=document.getElementById('app');if(view==='home'){app.innerHTML=`<header><div class="logo" onclick="go('home')">the Origin</div><div class="search-btn" onclick="openSearch()">Search</div></header><div class="hero"><div class="hero-item s1" onclick="go('activity')"><div class="hero-title">What's On</div></div><div class="hero-item s2" onclick="go('info')"><div class="hero-title">Info</div></div><div class="hero-item s3" onclick="go('showroom')"><div class="hero-title">Showroom</div></div><div class="hero-item s4" onclick="go('shop')"><div class="hero-title">Shop</div></div></div>`;}else if(view==='activity'){app.innerHTML=`<header class="activity-header"><div class="logo" onclick="go('home')">the Origin</div><div class="search-btn" onclick="openSearch()">Search</div></header><div class="content"><div class="page-title">What's On</div><div class="grid">${data.projects.map(p=>`<div class="card" onclick="showDetail('project','${p.id}')"><img src="${p.img}" class="card-img"><div class="card-title">${p.title}</div>${p.date?`<div class="card-sub">${p.date}</div>`:''}${p.loc?`<div class="card-sub">${p.loc}</div>`:''}</div>`).join('')}</div></div>`;}else if(view==='projectDetail'){const p=data.projects.find(x=>x.id===detail);const artistNames={'JOHANNES_WEISS':'Johannes Weiß','KEIKO_KIMOTO':'Keiko Kimoto','VOLKER_SEIFRIED':'Volker Seifried','JENNIFER_OELLERICH':'Jennifer Oellerich'};const artistImages=p.id==='p1'?['JOHANNES_WEISS','KEIKO_KIMOTO','VOLKER_SEIFRIED','JENNIFER_OELLERICH'].map(n=>`<div style="margin-bottom:40px;min-height:400px"><img src="https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/what_is_on/austellung/${n}.png" style="width:100%;height:400px;object-fit:cover;margin-bottom:10px;display:block;background:#f5f5f5" onerror="this.src='https://images.unsplash.com/photo-1561214115-f2f134cc4912?w=400'"><div style="font-size:12px;color:#666">${artistNames[n]}</div></div>`).join(''):'';app.innerHTML=`<header class="activity-header"><div class="logo" onclick="go('home')">the Origin</div><div class="search-btn" onclick="openSearch()">Search</div></header><div class="detail"><div class="back" onclick="go('activity')">←</div><div style="display:grid;grid-template-columns:1fr 2fr;gap:60px;align-items:start" class="project-detail-grid"><div><h1 style="font-size:18px;font-weight:700;margin-bottom:20px;text-transform:uppercase;letter-spacing:1.5px">${p.title}</h1>${p.date?`<p style="font-size:14px;margin-bottom:8px;line-height:1.6">${p.date}</p>`:''}${p.opening?`<p style="font-size:14px;margin-bottom:8px;line-height:1.6">${p.opening}</p>`:''}${p.loc?`<p style="font-size:14px;margin-bottom:8px;line-height:1.6">${p.loc}</p>`:''}${p.phone?`<p style="font-size:14px;margin-bottom:30px;line-height:1.6">${p.phone}</p>`:''}${p.desc?`<p style="font-size:14px;line-height:1.8;color:#333;white-space:pre-line">${p.desc}</p>`:''}</div><div><img src="${p.img}" style="width:100%;height:auto;object-fit:contain;margin-bottom:0"></div></div>${artistImages?`<div style="margin-top:60px"><div style="font-size:14px;font-weight:700;margin-bottom:30px;text-transform:uppercase;letter-spacing:1px">Artists</div><div style="max-width:400px">${artistImages}</div></div>`:''}</div>`;}else if(view==='showroom'){app.innerHTML=`<header class="showroom-header"><div class="logo" onclick="go('home')">the Origin</div><div class="search-btn" onclick="openSearch()">Search</div></header><div class="content"><div class="page-title">Showroom</div><div class="grid">${data.artists.map(a=>`<div class="card" onclick="showDetail('artist','${a.id}')"><img src="${a.img}" class="card-img"><div class="card-title">${a.name}</div><div class="card-sub">${a.role}</div></div>`).join('')}</div></div>`;}else if(view==='artistDetail'){const a=data.artists.find(x=>x.id===detail);app.innerHTML=`<header class="showroom-header"><div class="logo" onclick="go('home')">the Origin</div><div class="search-btn" onclick="openSearch()">Search</div></header><div class="detail"><div class="back" onclick="go('showroom')">←</div><div class="artist-first-section"><div class="artist-detail-grid" style="display:grid;grid-template-columns:auto 1fr;gap:60px;align-items:start;margin-bottom:60px"><div><img src="${a.works[0].i}" style="width:auto;height:auto;max-width:100%;max-height:90vh;object-fit:contain;background:#f5f5f5;display:block;margin-bottom:10px"><div style="text-align:left"><div style="font-weight:600;font-size:14px;margin-bottom:4px">${a.works[0].t}</div><div style="font-size:12px;color:#666">${a.works[0].d}</div></div></div><div class="artist-info-section"><div class="artist-name" style="margin-bottom:15px">${a.name}</div><div class="artist-bio">${a.bio}</div></div></div></div><div class="works-grid">${a.works.slice(1).map(w=>`<div class="work-item"><img src="${w.i}" style="width:auto;height:auto;max-width:100%;max-height:90vh;object-fit:contain;margin-bottom:10px;background:#f5f5f5;display:block"><div style="text-align:left"><div style="font-weight:600;font-size:14px;margin-bottom:4px">${w.t}</div><div style="font-size:12px;color:#666">${w.d}</div></div></div>`).join('')}</div></div>`;}else if(view==='info'){app.innerHTML=`<header class="info-header"><div class="logo" onclick="go('home')">the Origin</div><div class="search-btn" onclick="openSearch()">Search</div></header><div class="content"><div class="info-text"><h1>Info</h1><img src="https://raw.githubusercontent.com/thenocturne1/the-origin-archive/main/INFO/VIA_MORTI.jpg" class="info-hero"><p>The Origin is a process-oriented exhibition and exchange project initiated by the sculptors Johannes Weiß and Volker Seifried.</p><p>The project centres on fundamental questions: How does sculpture articulate space? What relationships emerge between object, body, and environment? How do material decisions shape spatial experience?</p><p>Rather than presenting sculpture as finished statement, The Origin makes the process of sculptural thinking visible. The project examines the body not as representation but as constructed system; architecture not as backdrop but as active participant; and environment not as neutral container but as co-author of meaning.</p><p>The Origin unfolds through a series of exhibitions at varying locations, each responding to specific spatial conditions. Between exhibitions, the collaborative process continues through studio visits, shared critique, and ongoing dialogue. This iterative method allows sculptural positions to develop in relation to one another—testing ideas, refining questions, building cumulative understanding.</p><p>The project invites a small group of participating artists into this exchange, creating a constellation of practices that inform and challenge one another. Through direct engagement with each other\'s work and with the specific conditions of each exhibition site, The Origin investigates how sculptural practice can become a form of sustained spatial inquiry.</p><p>We invite you to follow this evolving dialogue as it moves between studio, exhibition space, and environment—witnessing how sculptural thinking unfolds through conversation, material investigation, and the active negotiation of place.</p><p>Weiß and Seifried first met as student and teaching assistant at the Universität der Künste Berlin in the early 2000s. This shared formative experience in sculptural practice laid the groundwork for a lasting artistic dialogue spanning many years and numerous collaborative exhibitions. After decades of parallel practice, they have come together to realise The Origin.</p><p style="margin-top:40px"><strong>Address:</strong> Mittenwalder Str. 6, 10961 Berlin, Germany</p><p><a href="terms.html" target="_blank" class="info-link">Terms & Conditions</a></p><p><a href="terms.html" target="_blank" class="info-link">Privacy Policy</a></p><div style="margin-top:40px;display:flex;gap:15px;align-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></div><p style="margin-top:30px;font-weight:600">Subscribe</p></div></div>`;}else if(view==='shop'){app.innerHTML=`<header class="shop-header"><div class="logo" onclick="go('home')">the Origin</div><div class="search-btn" onclick="openSearch()">Search</div></header><div class="content"><div class="page-title">Shop</div><div class="grid">${data.products.map(p=>`<div class="card"><img src="${p.img}" class="card-img" onclick="showDetail('product','${p.id}')"><div class="card-title">${p.title}</div><div class="card-sub">${p.artist}</div><div class="card-price">€${p.price}</div><button class="btn btn-black" style="width:100%" onclick="addCart('${p.id}')">Add to Cart</button><button class="btn btn-white" style="width:100%" onclick="showDetail('product','${p.id}')">View Details</button></div>`).join('')}</div></div>`;}else if(view==='productDetail'){const p=data.products.find(x=>x.id===detail);app.innerHTML=`<header class="shop-header"><div class="logo" onclick="go('home')">the Origin</div><div class="search-btn" onclick="openSearch()">Search</div></header><div class="detail"><div class="back" onclick="go('shop')">←</div><div class="product-grid"><img src="${p.img}" class="product-img"><div><div class="product-title">${p.title}</div><div class="product-artist">${p.artist}</div>${p.price>0?`<div class="product-price">€${p.price}</div>`:''}<div class="product-desc">${p.desc}</div></div></div></div>`;}renderCart();}
        function renderCart(){const panel=document.getElementById('cartPanel'),total=cart.reduce((s,i)=>s+(i.price*i.qty),0);panel.innerHTML=`<div class="cart-header"><div class="cart-title">Cart</div><div class="cart-close" onclick="closeCart()">×</div></div><div class="cart-body">${cart.length===0?'<div class="cart-empty">Your cart is empty</div>':cart.map((it,i)=>`<div class="cart-item"><img src="${it.img}" class="cart-item-img"><div class="cart-item-info"><div class="cart-item-title">${it.title}</div><div class="cart-item-price">€${it.price}</div><div class="cart-item-qty"><button onclick="updateQty(${i},-1)">−</button><input type="number" value="${it.qty}" readonly><button onclick="updateQty(${i},1)">+</button></div><span class="cart-remove" onclick="removeItem(${i})">Remove</span></div></div>`).join('')}${cart.length>0?`<div class="cart-total"><div class="cart-total-row"><span>Total:</span><span>€${total}</span></div><button class="btn btn-black" style="width:100%;padding:16px" onclick="checkout()">Checkout</button></div>`:''}</div>`;}
        function go(v){view=v;window.scrollTo(0,0);render();}
        function showDetail(type,id){detail=id;view=type==='project'?'projectDetail':type==='artist'?'artistDetail':'productDetail';window.scrollTo(0,0);render();}
        function addCart(id,q=1){const p=data.products.find(x=>x.id===id),existing=cart.find(x=>x.id===id);if(existing)existing.qty+=q;else cart.push({...p,qty:q});notify('Added to cart!');qty=1;render();}
        function updateQty(i,c){cart[i].qty=Math.max(1,cart[i].qty+c);render();}
        function removeItem(i){cart.splice(i,1);render();}
        function openCart(){document.getElementById('cartPanel').classList.add('open');document.getElementById('cartOverlay').classList.add('open');}
        function closeCart(){document.getElementById('cartPanel').classList.remove('open');document.getElementById('cartOverlay').classList.remove('open');}
        function checkout(){alert('Thank you for your order!');cart=[];closeCart();render();}
        function notify(msg){const n=document.createElement('div');n.className='notif';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),2000);}
        function openSearch(){const overlay=document.createElement('div');overlay.className='search-overlay active';overlay.id='searchOverlay';overlay.innerHTML=`<div class="search-close" onclick="closeSearch()">×</div><div class="search-box"><input type="text" class="search-input" placeholder="Search..." id="searchInput"><div class="search-results" id="searchResults"></div></div>`;document.body.appendChild(overlay);setTimeout(()=>document.getElementById('searchInput').focus(),100);document.getElementById('searchInput').addEventListener('input',(e)=>{const q=e.target.value.toLowerCase(),all=[...data.projects.map(p=>({title:p.title,desc:p.sub,type:'project',id:p.id})),...data.artists.map(a=>({title:a.name,desc:a.role,type:'artist',id:a.id})),...data.products.map(p=>({title:p.title,desc:p.artist,type:'product',id:p.id}))],res=all.filter(i=>i.title.toLowerCase().includes(q)||i.desc.toLowerCase().includes(q));document.getElementById('searchResults').innerHTML=res.map(r=>`<div class="search-result" onclick="searchGo('${r.type}','${r.id}')"><div class="search-result-title">${r.title}</div><div class="search-result-desc">${r.desc}</div></div>`).join('');});overlay.addEventListener('click',(e)=>{if(e.target.id==='searchOverlay')closeSearch();});}
        function closeSearch(){const s=document.getElementById('searchOverlay');if(s)s.remove();}
        function searchGo(type,id){detail=id;view=type==='project'?'projectDetail':type==='artist'?'artistDetail':'productDetail';closeSearch();window.scrollTo(0,0);render();}
        document.getElementById('cartOverlay').addEventListener('click',closeCart);
        render();
    </script>
